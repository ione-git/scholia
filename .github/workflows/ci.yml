name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, scholia]
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/../DerivedData
    steps:
      - uses: actions/checkout@v7
      - run: command -v xcodegen || brew install xcodegen
      - run: make lint
      - run: |
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          UDID=$(scripts/sim create "$SIM") && echo "UDID=$UDID" >> "$GITHUB_ENV"
        env:
          SIM: CI-${{ runner.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - id: test
        run: make test DESTINATION="platform=iOS Simulator,id=$UDID" TEST_FLAGS="-retry-tests-on-failure -test-iterations 2 -parallel-testing-enabled YES -parallel-testing-worker-count 3"
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: never
      - if: always() && steps.test.outcome != 'skipped'
        run: scripts/test-report
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: build/Results-*.xcresult
      - if: always() && env.SIM != ''
        run: scripts/sim delete "$SIM"
