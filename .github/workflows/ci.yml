name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: make lint
      - run: make test DESTINATION='platform=iOS Simulator,name=iPhone 17 Pro,OS=26.4.1'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: build/Results-*.xcresult
