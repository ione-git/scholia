name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, scholia]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/../DerivedData
    steps:
      - uses: actions/checkout@v7
      - run: command -v xcodegen || brew install xcodegen
      - run: make lint
      - run: UDID=$(scripts/sim create CI-${{ runner.name }}) && echo "UDID=$UDID" >> "$GITHUB_ENV"
      - run: make test DESTINATION="platform=iOS Simulator,id=$UDID" TEST_FLAGS="-retry-tests-on-failure -test-iterations 2 -parallel-testing-enabled YES -parallel-testing-worker-count 3"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: build/Results-*.xcresult
