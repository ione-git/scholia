name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: make lint
      - uses: actions/cache@v6
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ hashFiles('Package.resolved') }}
      - timeout-minutes: 10
        run: UDID=$(scripts/sim create CI) && echo "UDID=$UDID" >> "$GITHUB_ENV"
      - run: make test DESTINATION="platform=iOS Simulator,id=$UDID" TEST_FLAGS="-retry-tests-on-failure -test-iterations 2 -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: build/Results-*.xcresult
