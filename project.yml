name: Scholia
options:
  bundleIdPrefix: io.github.ione-git
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  DesignSystem:
    path: Packages/DesignSystem
  ReaderEngine:
    path: Packages/ReaderEngine
targets:
  Scholia:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DesignSystem
      - package: ReaderEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ione-git.scholia
        PRODUCT_NAME: Scholia
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scholia
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_STYLE: Automatic
  ScholiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Scholia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ione-git.scholia.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Scholia
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Scholia:
    build:
      targets:
        Scholia: all
        ScholiaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScholiaUITests
