name: Scholia
options:
  bundleIdPrefix: com.ione
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3BD6GJJ883
packages:
  DesignSystem:
    path: Packages/DesignSystem
  ReaderEngine:
    path: Packages/ReaderEngine
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6
targets:
  Scholia:
    type: application
    platform: iOS
    sources:
      - App
      - path: Fixtures
        type: folder
    dependencies:
      - package: DesignSystem
      - package: ReaderEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ione.scholia
        PRODUCT_NAME: Scholia
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Scholia
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Fixtures
  ScholiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - __Snapshots__
      - App/Sources/LaunchConfiguration.swift
      - path: Design/design-system/project/tokens.json
        buildPhase: resources
      - path: Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Scholia
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ione.scholia.uitests
        TESTING_FRAMEWORK_MODULE_ALIAS_FLAGS: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Scholia
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Scholia:
    build:
      targets:
        Scholia: all
        ScholiaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScholiaUITests
