<!-- @dsCard group="Library" height=200 subtitle="Generated covers at three sizes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BookCover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600&display=swap">
<style>
html,body{margin:0;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.row{display:flex;align-items:center;gap:16px;padding:20px}
.c{flex-shrink:0;border-radius:var(--radius-sm);box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-cover);color:#f2ede3}
.t{font-family:var(--font-serif);font-weight:500;line-height:1.2}.a{letter-spacing:.08em;text-transform:uppercase;opacity:.85}
</style>
</head>
<body>
<div class="row">
<div class="c" style="width:160px;height:240px;padding:20px 16px;background:#2E3A4F;border-radius:8px;box-shadow:var(--shadow-cover-hero)"><div class="t" style="font-size:22px">Die Verwandlung</div><div class="a" style="font-size:10px">Franz Kafka</div></div>
<div class="c" style="width:107px;height:152px;padding:12px 10px;background:#35545E"><div class="t" style="font-size:13px">Solaris</div><div class="a" style="font-size:8px">Stanisław Lem</div></div>
<div class="c" style="width:80px;height:120px;padding:10px 8px;background:#6B2F3A;color:#f7edea"><div class="t" style="font-size:12px">Il nome della rosa</div><div class="a" style="font-size:8px">Umberto Eco</div></div>
<div class="c" style="width:40px;height:60px;background:#8A6D2F;border-radius:4px"></div>
</div>
</body>
</html>
