<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scholia — Library, remove confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;display=swap">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;background:#F4F2ED;color:#1D1B17;-webkit-font-smoothing:antialiased}
a{color:#1D1B17;text-decoration:none}a:hover{color:#1D1B17}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#8A857B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #F4F2ED">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<div style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; color: #1D1B17"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></div>
<div style="font-size: 20px; font-weight: 600">Library</div>
<div style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; color: #1D1B17"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></div>
</div>
<div style="display: flex; align-items: center; gap: 8px; height: 40px; border-radius: 12px; background: rgba(0,0,0,0.05); padding: 0 12px; color: #8A857B; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search titles and authors</div>
<div style="display: flex; gap: 8px; width: 600px">
<div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #1D1B17; color: #FFFFFF; font-size: 14px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px">All <span style="opacity: 0.6">24</span></div>
<div style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0.5px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #1D1B17; font-size: 14px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px">Science Fiction <span style="color: #6C675E">5</span></div>
<div style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0.5px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #1D1B17; font-size: 14px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px">Biographies <span style="color: #6C675E">4</span></div>
<div style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0.5px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #1D1B17; font-size: 14px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px">Fiction <span style="color: #6C675E">11</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 14px; margin-top: 6px">
<sc-for list="{{books}}" as="b" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="width: 107px; height: 152px; border-radius: 6px; background: {{b.bg}}; color: {{b.fg}}; padding: 12px 10px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.16), inset 3px 0 0 rgba(255,255,255,0.16)">
<div style="font-family: Literata, Georgia, serif; font-size: 13px; line-height: 1.25; font-weight: 500">{{b.title}}</div>
<div style="font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85">{{b.author}}</div>
</div>
<div style="font-size: 12px; line-height: 16px; color: #1D1B17; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.title}}</div>
</div>
</sc-for>
</div>
</div>

<a href="Library-A.dc.html" aria-label="Cancel" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(29, 27, 23, 0.32)"></a>

<div role="alertdialog" aria-label="Remove Solaris from your library?" style="position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 8px">
<div style="border-radius: 28px; background: rgba(255,255,255,0.92); backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 -2px 30px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.05); display: flex; flex-direction: column">
<div style="padding: 18px 20px 14px; text-align: center; border-bottom: 0.5px solid rgba(0,0,0,0.1)">
<div style="font-size: 15px; font-weight: 600">Remove “Solaris” from your library?</div>
<div style="font-size: 13px; color: #6C675E; margin-top: 4px; line-height: 1.35">The book file and its 7 highlights will be deleted from this iPhone.</div>
</div>
<button style="height: 56px; border: 0; background: transparent; font-size: 20px; font-weight: 400; color: #B3261E; padding: 0">Remove</button>
</div>
<a href="Library-A.dc.html" style="height: 56px; border-radius: 28px; background: rgba(255,255,255,0.92); backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #1D1B17">Cancel</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      books: [
        { title: 'Die Verwandlung', author: 'Franz Kafka', bg: '#2E3A4F', fg: '#F2EDE3' },
        { title: 'Solaris', author: 'Stanisław Lem', bg: '#35545E', fg: '#F2EDE3' },
        { title: 'Educated', author: 'Tara Westover', bg: '#8A6D2F', fg: '#F7F2E6' },
        { title: 'L’Étranger', author: 'Albert Camus', bg: '#9A6B4E', fg: '#FBF6EE' },
        { title: 'Il nome della rosa', author: 'Umberto Eco', bg: '#6B2F3A', fg: '#F7EDEA' },
        { title: 'Le Petit Prince', author: 'Antoine de Saint-Exupéry', bg: '#7A5A1E', fg: '#FBF4E4' },
        { title: 'Steve Jobs', author: 'Walter Isaacson', bg: '#4A4A48', fg: '#F4F2ED' },
        { title: 'Cien años de soledad', author: 'Gabriel García Márquez', bg: '#2F5D50', fg: '#EEF4EE' },
        { title: 'Der Schwarm', author: 'Frank Schätzing', bg: '#1F3B57', fg: '#E9EFF5' }
      ]
    };
  }
}
</script>
</body>
</html>
